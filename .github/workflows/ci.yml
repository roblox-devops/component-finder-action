name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm ci

      - name: Check Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run ci-test

      - name: Package
        run: pnpm run package

  test-action:
    name: Action Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Find Fixture Components
        id: test-action
        uses: ./
        with:
          components: alpha:1.2.3, beta
          component-search-directories: __fixtures__/components

      - name: Verify Output
        env:
          COMPONENTS: ${{ steps.test-action.outputs.components }}
        run: |
          test "$(node -e "console.log(Object.keys(JSON.parse(process.env.COMPONENTS)).sort().join(','))")" = "alpha:1.2.3,beta:latest"
